databaseChangeLog:
  - changeSet:
  id: 1
  author: system
  changes:
    - createTable:
  tableName: roles
  columns:
    - column:
  name: id
  type: BIGINT
  autoIncrement: true
  constraints:
  primaryKey: true
    - column:
  name: name
  type: VARCHAR(50)
  constraints:
  unique: true
  nullable: false

    - createTable:
  tableName: users
  columns:
    - column:
  name: id
  type: BIGINT
  autoIncrement: true
  constraints:
  primaryKey: true
    - column:
  name: username
  type: VARCHAR(100)
  constraints:
  unique: true
  nullable: false
    - column:
  name: password
  type: VARCHAR(255)
  constraints:
  nullable: false
    - column:
  name: enabled
  type: BOOLEAN
  defaultValueBoolean: true

    - createTable:
  tableName: user_roles
  columns:
    - column:
  name: user_id
  type: BIGINT
  constraints:
  nullable: false
    - column:
  name: role_id
  type: BIGINT
  constraints:
  nullable: false

    - addForeignKeyConstraint:
  baseTableName: user_roles
  baseColumnNames: user_id
  constraintName: fk_user_roles_user
  referencedTableName: users
  referencedColumnNames: id

    - addForeignKeyConstraint:
  baseTableName: user_roles
  baseColumnNames: role_id
  constraintName: fk_user_roles_role
  referencedTableName: roles
  referencedColumnNames: id

    - createTable:
  tableName: cards
  columns:
    - column:
  name: id
  type: BIGINT
  autoIncrement: true
  constraints:
  primaryKey: true
    - column:
  name: card_number
  type: VARCHAR(255)
  constraints:
  unique: true
  nullable: false
    - column:
  name: owner_id
  type: BIGINT
  constraints:
  nullable: false
    - column:
  name: expiry_date
  type: DATE
  constraints:
  nullable: false
    - column:
  name: status
  type: VARCHAR(20)
  constraints:
  nullable: false
    - column:
  name: balance
  type: DECIMAL(19,2)
  defaultValueNumeric: 0.00

    - addForeignKeyConstraint:
  baseTableName: cards
  baseColumnNames: owner_id
  constraintName: fk_cards_user
  referencedTableName: users
  referencedColumnNames: id

    - createTable:
  tableName: transactions
  columns:
    - column:
  name: id
  type: BIGINT
  autoIncrement: true
  constraints:
  primaryKey: true
    - column:
  name: from_card_id
  type: BIGINT
  constraints:
  nullable: false
    - column:
  name: to_card_id
  type: BIGINT
  constraints:
  nullable: false
    - column:
  name: amount
  type: DECIMAL(19,2)
  constraints:
  nullable: false
    - column:
  name: created_at
  type: TIMESTAMP
  defaultValueComputed: CURRENT_TIMESTAMP

    - addForeignKeyConstraint:
  baseTableName: transactions
  baseColumnNames: from_card_id
  constraintName: fk_transactions_from_card
  referencedTableName: cards
  referencedColumnNames: id

    - addForeignKeyConstraint:
  baseTableName: transactions
  baseColumnNames: to_card_id
  constraintName: fk_transactions_to_card
  referencedTableName: cards
  referencedColumnNames: id

    - insert:
  tableName: roles
  columns:
    - column:
  name: id
  valueNumeric: 1
    - column:
  name: name
  value: ROLE_ADMIN
    - insert:
  tableName: roles
  columns:
    - column:
  name: id
  valueNumeric: 2
    - column:
  name: name
  value: ROLE_USER

    - insert:
  tableName: users
  columns:
    - column:
  name: id
  valueNumeric: 1
    - column:
  name: username
  value: admin
    - column:
  name: password
  value: "$2a$10$7eqJtq98hPqEX7fNZaFWoO5X9T7lR1Jk1d1V9nJxXvVv1YxN0O7lO" # bcrypt: admin
    - column:
  name: enabled
  valueBoolean: true

    - insert:
  tableName: user_roles
  columns:
    - column:
  name: user_id
  valueNumeric: 1
    - column:
  name: role_id
  valueNumeric: 1